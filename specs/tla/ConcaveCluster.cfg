\* TLC Model Checking Configuration for ConcaveCluster.tla
\* Run with:
\*   java -jar tla2tools.jar -config ConcaveCluster.cfg ConcaveCluster.tla

SPECIFICATION Spec

CONSTANTS
    Replicas    = {r1, r2}
    Clients     = {c1, c2}
    Keys        = {k1, k2}
    Values      = {0, 1}
    TxIds       = {t1, t2}
    MaxCommitTs = 2
    MaxReqs     = 1
    MaxEpoch    = 1

INVARIANTS
    TypeOK
    StrictSerializability
    NoMissedInvalidation
    MonotonicClientCommitTs
    AtomicTransitionNoTornReads
    QuiescentOptimisticConvergence

PROPERTIES
    EventualConvergence
