<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Concave real-time architecture: two browser tabs syncing live via binary WebSockets through a single native Roc + Zig binary">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="960" height="360" rx="18" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header pills -->
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="34" y="42" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.4">Concave</text>
    <text x="132" y="42" fill="#94a3b8" font-size="14" font-weight="500">One Roc backend · One native binary · Zero external dependencies</text>

    <rect x="642" y="22" width="92" height="26" rx="13" fill="#0ea5e922" stroke="#38bdf855"/>
    <text x="688" y="39" fill="#38bdf8" font-size="11.5" font-weight="600" text-anchor="middle">5.8 KB gz</text>

    <rect x="744" y="22" width="84" height="26" rx="13" fill="#34d39922" stroke="#34d39955"/>
    <text x="786" y="39" fill="#34d399" font-size="11.5" font-weight="600" text-anchor="middle">0 deps</text>

    <rect x="838" y="22" width="90" height="26" rx="13" fill="#818cf822" stroke="#818cf855"/>
    <text x="883" y="39" fill="#a5b4fc" font-size="11.5" font-weight="600" text-anchor="middle">48 µs p50</text>
  </g>

  <!-- Left: Browser Tab A -->
  <g transform="translate(34, 72)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="248" height="252" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1.2"/>
    <rect width="248" height="30" rx="12" fill="#1e293b"/>
    <rect y="18" width="248" height="12" fill="#1e293b"/>
    <circle cx="16" cy="15" r="4" fill="#f87171"/>
    <circle cx="30" cy="15" r="4" fill="#fbbf24"/>
    <circle cx="44" cy="15" r="4" fill="#34d399"/>
    <text x="60" y="19" fill="#cbd5e1" font-size="11" font-weight="600">Tab A — #general (Alice)</text>

    <rect x="14" y="44" width="220" height="34" rx="7" fill="#0f172a" stroke="#1e293b"/>
    <text x="24" y="59" fill="#38bdf8" font-size="10.5" font-weight="600">Concave</text>
    <text x="24" y="72" fill="#cbd5e1" font-size="10.5">Welcome! Open a second tab.</text>

    <rect x="14" y="86" width="220" height="44" rx="7" fill="#1d4ed826" stroke="#38bdf888"/>
    <text x="24" y="101" fill="#7dd3fc" font-size="10.5" font-weight="600">Alice · optimistic (0 ms)</text>
    <text x="24" y="117" fill="#f8fafc" font-size="11.5" font-weight="500">Shipped WAL group commit!</text>

    <rect x="14" y="142" width="220" height="24" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="24" y="158" fill="#64748b" font-size="10.5">/_concave/index.js · 5.8 KB gz · 304</text>

    <rect x="14" y="176" width="220" height="62" rx="8" fill="#0b1120" stroke="#1e293b"/>
    <text x="24" y="194" fill="#94a3b8" font-size="10" font-weight="600">CLIENT RUNTIME</text>
    <text x="24" y="210" fill="#e2e8f0" font-size="11">• Glitch-free push-pull signals</text>
    <text x="24" y="226" fill="#e2e8f0" font-size="11">• CBIN v1 binary WS + optimistic UI</text>
  </g>

  <!-- Center: Single Native Binary -->
  <g transform="translate(342, 72)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="276" height="252" rx="14" fill="url(#card)" stroke="url(#accent)" stroke-width="1.8"/>
    <text x="138" y="30" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Single ~2 MB Native Binary</text>
    <text x="138" y="47" fill="#94a3b8" font-size="11" text-anchor="middle">Multi-Core AOT Roc + Zig 0.17 std</text>

    <rect x="16" y="62" width="244" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="28" y="79" fill="#38bdf8" font-size="11" font-weight="700">Unified Transport</text>
    <text x="28" y="95" fill="#cbd5e1" font-size="10.5">Binary WS (CBIN v1) · HTTP/2 h2c · HTTP/1.1</text>

    <rect x="16" y="112" width="244" height="54" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="28" y="129" fill="#a5b4fc" font-size="11" font-weight="700">ACID OCC + Surgical ReadSet Engine</text>
    <text x="28" y="145" fill="#cbd5e1" font-size="10.5">Schema validation · Isolated Components</text>
    <text x="28" y="159" fill="#94a3b8" font-size="10">Lean 4 · Maude · Z3 formally verified</text>

    <rect x="16" y="174" width="244" height="62" rx="8" fill="#0f172a" stroke="#34d39955"/>
    <text x="28" y="191" fill="#34d399" font-size="11" font-weight="700">Storage Backends (Zero Deps)</text>
    <text x="28" y="207" fill="#e2e8f0" font-size="10.5">WalStore: O(log N) indexes + Group Commit</text>
    <text x="28" y="223" fill="#cbd5e1" font-size="10.5">PgStore: Pooled TLS 1.3 Postgres + PgBouncer</text>
  </g>

  <!-- Right: Browser Tab B + Dashboard -->
  <g transform="translate(678, 72)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="248" height="120" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1.2"/>
    <rect width="248" height="28" rx="12" fill="#1e293b"/>
    <rect y="16" width="248" height="12" fill="#1e293b"/>
    <circle cx="16" cy="14" r="3.5" fill="#34d399"/>
    <text x="28" y="18" fill="#cbd5e1" font-size="11" font-weight="600">Tab B — #general (Bob)</text>
    <rect x="14" y="40" width="220" height="44" rx="7" fill="#065f4633" stroke="#34d39988"/>
    <text x="24" y="55" fill="#34d399" font-size="10.5" font-weight="600">Live Binary Push · 0x83 transition</text>
    <text x="24" y="71" fill="#f8fafc" font-size="11.5" font-weight="500">Shipped WAL group commit!</text>
    <text x="14" y="106" fill="#94a3b8" font-size="10">#roc-lang subscribers untouched (0 work)</text>

    <rect y="132" width="248" height="120" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1.2"/>
    <rect y="132" width="248" height="28" rx="12" fill="#1e293b"/>
    <rect y="148" width="248" height="12" fill="#1e293b"/>
    <text x="14" y="150" fill="#a5b4fc" font-size="11" font-weight="700">/_dashboard · Built-in Live UI</text>
    <text x="14" y="178" fill="#e2e8f0" font-size="10.5">• Live Data Browser &amp; Function Runner</text>
    <text x="14" y="196" fill="#e2e8f0" font-size="10.5">• Scheduler / Crons &amp; HTTP Routes</text>
    <text x="14" y="214" fill="#e2e8f0" font-size="10.5">• Prometheus /_internal/metrics</text>
    <text x="14" y="232" fill="#94a3b8" font-size="10">Embedded inside the binary · 0 setup</text>
  </g>

  <!-- Arrows -->
  <g stroke="url(#accent)" stroke-width="2" fill="none">
    <path d="M 284 150 L 338 150"/>
    <path d="M 332 145 L 339 150 L 332 155"/>
    <path d="M 338 186 L 284 186" stroke-dasharray="4 3"/>
    <path d="M 290 181 L 283 186 L 290 191"/>

    <path d="M 620 132 L 674 132"/>
    <path d="M 668 127 L 675 132 L 668 137"/>

    <path d="M 620 264 L 674 264" stroke="#818cf8"/>
    <path d="M 668 259 L 675 264 L 668 269" stroke="#818cf8"/>
  </g>
</svg>
