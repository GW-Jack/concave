# Fly.io deployment configuration for a standalone Concave app
# Usage:
#   fly launch --no-deploy
#   fly volumes create concave_data --size 1 --region iad   # (omit if using DATABASE_URL Postgres)
#   fly secrets set CONCAVE_ADMIN_KEY="$(openssl rand -hex 24)" CONCAVE_ALLOW_DEV_TOKENS="false"
#   fly deploy

app = "concave-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CONCAVE_HOST = "0.0.0.0"
  CONCAVE_DB_PATH = "/data/concave.wal"
  CONCAVE_STORAGE_DIR = "/data/storage"
  CONCAVE_LOG_FORMAT = "json"
  CONCAVE_ALLOW_DEV_TOKENS = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "concave_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
